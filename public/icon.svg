<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1850"/>
      <stop offset="0.45" stop-color="#c9506e"/>
      <stop offset="0.72" stop-color="#ffa070"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c4"/>
      <stop offset="0.55" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#78f8dc"/>
      <stop offset="0.5" stop-color="#15a4a8"/>
      <stop offset="1" stop-color="#0a5670"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4860"/>
      <stop offset="1" stop-color="#127a8a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a59f"/>
      <stop offset="1" stop-color="#0a5670"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="372" cy="176" r="120" fill="url(#sun)" opacity="0.55"/>
  <circle cx="372" cy="176" r="62" fill="#ffd38a"/>
  <!-- body of the wave behind the face and inside the tube, so nothing shows through -->
  <path d="M512 352 C430 350 380 300 350 230 L300 220 L296 392 L512 392 Z" fill="url(#face)"/>
  <path d="M150 262 C148 206 196 180 232 188 C300 202 334 300 314 392 L200 392 C168 360 152 320 150 262 Z" fill="url(#tube)"/>
  <!-- the wave: face rising from the right, curling over to the left -->
  <path d="M512 352 C430 350 380 300 350 230 C322 166 262 120 196 126 C126 132 78 186 84 252 C88 300 122 330 160 326 C190 323 206 296 196 272 C188 252 166 250 156 262 C146 220 178 186 220 190 C272 194 300 250 310 320 C316 360 300 392 300 392 L512 392 Z" fill="url(#face)"/>
  <!-- inside of the tube -->
  <path d="M156 262 C166 250 188 252 196 272 C206 296 190 323 160 326 C214 340 262 352 300 392 C312 330 292 228 222 206 C186 196 150 222 156 262 Z" fill="url(#tube)" opacity="0.92"/>
  <!-- foam on the lip -->
  <path d="M84 252 C78 186 126 132 196 126 C262 120 322 166 350 230" fill="none" stroke="#fff4e8" stroke-width="16" stroke-linecap="round"/>
  <path d="M84 252 C88 300 122 330 160 326" fill="none" stroke="#c8fff1" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <circle cx="98" cy="292" r="7" fill="#fff4e8"/><circle cx="118" cy="314" r="5" fill="#fff4e8"/><circle cx="76" cy="276" r="5" fill="#fff4e8"/>
  <!-- surfer tucked in the barrel -->
  <g transform="translate(238 318) rotate(-14)">
    <ellipse cx="0" cy="14" rx="40" ry="7" fill="#fff0dc"/>
    <path d="M-12 12 L-4 -10 L8 -10 L16 12" fill="none" stroke="#24335a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 -10 L-2 -30" stroke="#ff6b4a" stroke-width="12" stroke-linecap="round"/>
    <path d="M-2 -26 L-22 -18 M0 -26 L20 -22" stroke="#b5764f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-3" cy="-40" r="8" fill="#b5764f"/>
  </g>
  <!-- sea in front -->
  <path d="M0 384 C80 376 160 392 260 386 C360 380 440 392 512 386 L512 512 L0 512 Z" fill="url(#sea)"/>
  <path d="M0 384 C80 376 160 392 260 386 C360 380 440 392 512 386" fill="none" stroke="#fff4e8" stroke-width="8" opacity="0.9"/>
  <path d="M40 430 L120 430 M300 446 L400 446 M170 470 L230 470" stroke="#78f8dc" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
</svg>
